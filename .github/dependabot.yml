---
version: 2
updates:
- package-ecosystem: "uv"
  directory: "/"
  schedule:
    interval: "monthly"
  groups:
    dev-tools:
      patterns:
      - "pytest*"
      - "ruff"
      - "ty"
  assignees:
  - "gmazoyer"
  labels:
  - "type: housekeeping"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  assignees:
  - "gmazoyer"
  labels:
  - "type: housekeeping"
